<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects</title>

    <!-- 메인 CSS -->
    <link rel="stylesheet" href="css/projects.css" />

    <!-- 미디어쿼리 -->
    <link rel="stylesheet" href="css/media.css" />

    <!-- 메인 JS -->
    <script src="js/projects.js" defer></script>
  </head>
  <body>
    <!-- 상단 -->
    <header>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html#intro">Home</a></li>
          <li><a href="projects.html" class="active">Projects</a></li>
          <li><a href="index.html#about">About me</a></li>
          <li><a href="index.html#contact">Contact</a></li>
        </ul>
      </nav>
    </header>

    <!-- 프로젝트 목록 -->
    <main class="project-main">
      <div class="container">
        <!-- 카테고리 필터 -->
        <div class="filter-tabs">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="web">Web</button>
          <button class="filter-btn" data-filter="graphic">Graphic</button>
        </div>

        <!-- 프로젝트 그리드 -->
        <div class="project-list">
          <!-- 프로젝트 1 -->
          <div class="project-item" data-category="web">
            <a
              href="https://kgh057.github.io/mabinogimobile/"
              target="_blank"
              class="project-image"
            >
              <img src="image/pj2.png" alt="마비노기모바일" />
            </a>
            <div class="project-header">
              <h3 class="project-title">마비노기 모바일 웹사이트 리뉴얼</h3>
              <div class="project-icons">
                <a
                  href="./file/마비노기모바일_PDF.pdf"
                  target="_blank"
                  class="project-icon"
                >
                  <img src="./image/link.png" alt="사이트 보기" />
                </a>
                <a
                  href="https://github.com/kgh057/mabinogimobile"
                  target="_blank"
                  class="project-icon"
                >
                  <img src="./image/github1.png" alt="GitHub" />
                </a>
              </div>
            </div>
            <span class="project-desc">개인 프로젝트</span>
          </div>

          <!-- 프로젝트 2 -->
          <div class="project-item" data-category="web">
            <a
              href="https://kgh057.github.io/muzigae-mansion/"
              target="_blank"
              class="project-image"
            >
              <img src="image/pj1.png" alt="무지개맨션" />
            </a>
            <div class="project-header">
              <h3 class="project-title">무지개맨션 웹사이트 사용성 개선</h3>
              <div class="project-icons">
                <a
                  href="./file/무지개맨션_PDF.pdf"
                  target="_blank"
                  class="project-icon"
                >
                  <img src="./image/link.png" alt="PDF 보기" />
                </a>
                <a
                  href="https://github.com/kgh057/muzigae-mansion"
                  target="_blank"
                  class="project-icon"
                >
                  <img src="./image/github1.png" alt="GitHub" />
                </a>
              </div>
            </div>
            <span class="project-desc">개인 프로젝트</span>
          </div>

          <!-- 프로젝트 3 -->
          <div class="project-item" data-category="web">
            <div
              class="project-image lightbox-trigger"
              data-img="image/dasique3.png"
              data-title="웹사이트 UXUI 유지보수 및 기능 개선"
            >
              <img
                src="image/dasique3.png"
                alt="웹사이트 UXUI 유지보수 및 기능 개선"
              />
            </div>
            <div class="project-header">
              <h3 class="project-title">웹사이트 UXUI 유지보수 및 기능 개선</h3>
            </div>
            <span class="project-desc">프로젝트</span>
          </div>

          <!-- 프로젝트 4 -->
          <div class="project-item" data-category="graphic">
            <div
              class="project-image lightbox-trigger"
              data-img="image/dasique3.png"
              data-title="데이지크 모델컷을 활용한 AI 그래픽 작업"
            >
              <img
                src="image/dasique3.png"
                alt="데이지크 모델컷을 활용한 AI 그래픽 작업"
              />
            </div>
            <div class="project-header">
              <h3 class="project-title">
                데이지크 모델컷을 활용한 AI 그래픽 작업
              </h3>
            </div>
            <span class="project-desc">데이지크 수플레 컬러 팟</span>
          </div>

          <!-- 프로젝트 5 -->
          <div class="project-item" data-category="graphic">
            <div
              class="project-image lightbox-trigger"
              data-img="image/espoir1.png"
              data-title="에스쁘아 제품컷을 활용한 AI 그래픽 작업"
            >
              <img
                src="image/espoir1.png"
                alt="에스쁘아 제품컷을 활용한 AI 그래픽 작업"
              />
            </div>
            <div class="project-header">
              <h3 class="project-title">
                에스쁘아 제품컷을 활용한 AI 그래픽 작업
              </h3>
            </div>
            <span class="project-desc"
              >에스쁘아 꾸뛰르 립틴트 글레이즈 '허쉬드 체리'</span
            >
          </div>
        </div>

        <!-- 필터 결과가 없을 때 -->
        <p class="no-result">해당 카테고리의 프로젝트가 없습니다.</p>
      </div>
    </main>

    <!-- 프로젝트 모달 -->
    <div class="lightbox-overlay" id="lightbox">
      <div class="lightbox-box">
        <button class="lightbox-close" id="lightboxClose">✕</button>
        <img src="" alt="" class="lightbox-img" id="lightboxImg" />
      </div>
    </div>

    <!-- 하단 -->
    <footer>
      <p>© 2026 Kim Geunhae</p>
    </footer>

    <!-- scroll-top -->
    <button class="scroll-top" id="scrollTop">
      <img src="./image/Arrow_up.svg" alt="arrow up" />
    </button>
  </body>
</html>
